; Flow Kit process tree.
;
; Start order matters and is enforced by priority: the display must exist
; before Chrome, and Chrome should be up before the agent starts expecting a
; WebSocket connection. Nothing here polls for readiness — every process
; retries on its own, and supervisord restarts whatever dies.

; This file IS the main supervisord config (not an include) — a [supervisord]
; section inside conf.d/ would collide with the packaged default.
;
; pid and socket live under /tmp because supervisord runs as the unprivileged
; flowkit user and cannot write /var/run.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; The watchdog restarts Chrome through this socket, so the CLI must be present.
[supervisorctl]
serverurl=unix:///tmp/supervisor.sock


; ─── Virtual display ────────────────────────────────────────
; 1366x768, down from 1920x1080. There is no GPU in here, so Chrome composites
; the screen in software, and that cost is linear in pixels -- this is 49% of
; the pixels and so roughly half the compositing bill, measured at three cores.
;
; It is also the most common desktop resolution there is, so it is duller to a
; fingerprinter than 1920x1080, and Flow's UI is still comfortable on it. This
; is the screen someone works on through the Browser page.
;
; Change WINDOW_SIZE in the chrome block below to match if you change it here.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24 -nolisten tcp
priority=10
autorestart=true
startsecs=2
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err


; ─── Chrome ─────────────────────────────────────────────────
; The flags added below are memory, not behaviour:
;   --disable-dev-shm-usage    put shared memory in /tmp instead of /dev/shm,
;                              which is what lets the compose file drop
;                              shm_size entirely. Slower in theory; one tab.
;   --renderer-process-limit=1 one tab, one renderer, hard ceiling.
;   --disable-sync             no profile is signed into Chrome sync.
;   --disable-breakpad         nothing collects the crash dumps.
;
; NOT here, and must not be added back:
;
;   --disable-background-networking
;       It reads like a harmless way to stop a container chattering, and it
;       disables Chrome's *extension updater* along with everything else. The
;       extension is force-installed through enterprise policy, and policy
;       installs are fetched by that same updater -- so with this flag Chrome
;       starts, reads the policy, and then never fetches the CRX. Nothing
;       errors. The extension simply never appears, the agent waits forever for
;       a WebSocket that never opens, and the watchdog restarts Chrome on a
;       loop. Cost: one deploy spent chasing dbus noise.
;
;   --disable-component-update
;       Less clearly implicated, but it is the same family of "stop Chrome
;       fetching things" flags, and the saving is not worth re-opening this.
;
; Not added: --disable-gpu. It would kill a whole process, but it also changes
; the WebGL renderer strings a fingerprinter reads, and reCAPTCHA scoring is
; the one thing this service cannot afford to degrade. If you try it, try it
; alone, and confirm generation still works before keeping it.
;
; That precaution was correct and was not enough. With no GPU in the container
; Chrome blocklists the software path on its own, and the logs filled with
;
;   ContextResult::kFatalFailure: WebGL1 blocklisted
;
; a hundred times a day. So canvas.getContext('webgl') was returning null: not
; an unusual renderer string, no renderer at all. reCAPTCHA Enterprise reads
; WebGL as a primary signal and every real browser answers it, so the absence
; is a much louder automation tell than anything --disable-gpu would have done.
; The flag was avoided and the damage taken anyway.
;
; SwiftShader is Chrome's own software rasteriser. It answers WebGL properly
; and reports a normal ANGLE renderer, which is what the fingerprint expects.
;   --use-gl=angle --use-angle=swiftshader   route WebGL through it
;   --enable-unsafe-swiftshader              recent Chrome gates it behind this
;                                            flag; "unsafe" here means software
;                                            rendering of untrusted content, not
;                                            a security downgrade for us.
;
; If generation ever stops after a Chrome upgrade, take these three off first:
; they are the newest thing here and the easiest to rule out.
;
; Two omissions are deliberate and load-bearing:
;   --headless          fingerprintable; reCAPTCHA is the whole ballgame here
;   --enable-automation sets navigator.webdriver, same problem
;
; No --load-extension here. Chrome 151 ignores it: measured on this exact
; build, with the flag present and the extension valid (chrome
; --pack-extension exits 0), Chrome loads its four component extensions and
; not ours, printing nothing. --disable-extensions-except and
; --disable-features=DisableLoadExtensionCommandLineSwitch did not restore it.
;
; The extension is force-installed by enterprise policy instead — see
; docker/pack-extension.sh. Chrome reads the policy from
; /etc/opt/chrome/policies/managed and fetches the CRX from the agent, which
; is why `agent` starts before `chrome` below.
; Chrome opens on a blank tab and the extension points it at the right page
; as soon as it is up -- the queued job's project, or the Flow home page when
; nothing is queued and someone is signing in. It used to open the home page
; itself, which meant every start loaded a page the job then navigated away
; from. See landWhereTheWorkIs in extension/background.js.
[program:chrome]
; Through a small wrapper that picks the active Google account's profile --
; see docker/chrome-launch.sh and agent/accounts.py. The flags are unchanged.
command=/usr/local/bin/chrome-launch.sh
    --no-first-run
    --no-default-browser-check
    --disable-background-timer-throttling
    --disable-renderer-backgrounding
    --disable-features=CalculateNativeWinOcclusion
    --window-position=0,0
    --window-size=1366,768
    --start-maximized
    --disable-dev-shm-usage
    ; Video thumbnails on the Flow pages autoplay, and there is no GPU in this
    ; container — every frame is decoded and composited in software, forever,
    ; on a page nobody is looking at. That was three cores.
    ;
    ; This restricts nothing the browser needs: it is what a real Chrome does
    ; by default, so it makes this one less unusual rather than more. It is not
    ; a resource limit — starving Chrome of CPU or memory stops the page
    ; issuing the request the bearer token rides on, which reads as
    ; NO_FLOW_KEY and takes generation down. Cap the container and you break
    ; it; stop the pointless decoding and you do not.
    --autoplay-policy=user-gesture-required
    --renderer-process-limit=1
    ; The GPU process here is the display compositor, and it is the whole cost:
    ; measured at 204% of the container's 236%, with the renderer at 19%. That
    ; split is the diagnosis. CSS transform and opacity animations run on the
    ; compositor thread rather than in the renderer, so a page that animates
    ; keeps SwiftShader redrawing the screen at full frame rate while the page's
    ; own process sits idle.
    ;
    ; --disable-gpu-rasterization was tried here and made it worse (267%), so it
    ; is gone. Software compositing cost is linear in pixels, which leaves the
    ; screen size as the lever that reliably works -- see the Xvfb block above.
    ;
    ; Still not options, for the same reason as always: --disable-gpu and
    ; --disable-software-rasterizer take WebGL away, and reCAPTCHA reads it.
    --num-raster-threads=1
    --use-gl=angle
    --use-angle=swiftshader
    --enable-unsafe-swiftshader
    --disable-sync
    --disable-breakpad
    about:blank
environment=DISPLAY=":99"
priority=30
; Not started with the container. Chrome's GPU process costs 170% of a 185%
; container with nothing loaded -- six marl worker threads spin-waiting inside
; SwiftShader, with VizCompositorThread at 5%, so it is the process existing
; rather than anything on screen. The agent starts it when a job is queued and
; stops it once the queue has been empty for CHROME_IDLE_STOP seconds; see
; agent/chrome.py, which carries the measurement.
;
; The Google session is not lost with it: the profile is on the /data volume,
; and the extension is force-installed from policy again on the next start,
; which is the same path a cold container already takes.
;
; Signing in by hand needs a browser, so /flow/chrome starts one on demand and
; the platform's Browser page calls it.
autostart=false
; Left true deliberately. supervisord does not apply autorestart to a program
; stopped through supervisorctl, so this keeps crash recovery during a run
; without fighting the deliberate stop between runs.
autorestart=true
startsecs=10
startretries=5
; Stop gently: SIGTERM to the browser process only, which closes its own
; children and writes its cookies to disk on the way out. Sending it to the
; whole group killed the network process -- the one holding the cookie
; database -- at the same moment, and the last few minutes of Google's
; rotating session cookies were lost: a sign-in made just before the stop
; came back signed out, and Google reads a stale session cookie as a stolen
; one. The group is still killed if Chrome has not exited after 30 s.
stopsignal=TERM
stopasgroup=false
killasgroup=true
stopwaitsecs=30
; Chrome's own diagnostics go to the container's stdout/stderr so they show up
; in `docker logs` and the Dokploy log view. A crash-looping Chrome whose
; reason is written to a file inside the container is undiagnosable from
; outside, which is exactly the position a SIGTRAP loop leaves you in.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0


; ─── The agent (HTTP API + WS server + worker) ──────────────
; Starts before Chrome (priority 20 vs 30). Chrome's policy points its
; extension update URL at this agent, so if the agent isn't listening when
; Chrome first polls, the install is deferred to a later retry — minutes of
; looking broken for no reason.
[program:agent]
command=/usr/local/bin/python -m agent.main
directory=/app
priority=20
autorestart=true
startsecs=5
; Everything the agent knows goes to the container's stdout, the same as
; Chrome above. It used to write here to files inside the container, which
; meant `docker logs` carried Chrome's GPU noise and nothing else: no job
; lifecycle, no errors, no API responses. A reCAPTCHA rejection was diagnosed
; from a truncated copy that had travelled to the platform's run page, because
; that was the only copy that ever escaped.
;
; Buffering matters as much as the destination. Python line-buffers to a pipe
; but block-buffers when it thinks it is writing to a file, so without
; PYTHONUNBUFFERED the logs arrive in 8KB lumps, minutes late, which is its own
; kind of invisible.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"


; ─── VNC + noVNC, for the Google sign-in and browser view ──
; x11vnc stays bound to loopback: websockify is the only thing that reaches it.
;
; No -rfbauth. websockify binds the container's network interface, but this
; container publishes no ports and has no domain, and Docker routes inbound
; traffic to published ports only — so the one thing that can reach 6080 is the
; platform container, which proxies it at /browser behind the session cookie it
; already validates. A second 8-character VNC password protects nothing.
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -localhost -quiet -rfbport 5900
    -nap -wait 100 -defer 100
priority=40
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=50
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
