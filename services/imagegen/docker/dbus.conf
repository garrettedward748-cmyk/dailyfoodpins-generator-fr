<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  A minimal bus for Chrome to talk to.

  Chrome looks for the system bus at /run/dbus/system_bus_socket and logs an
  ERROR line every time it is missing — for power state, screensaver
  inhibition, the network monitor, and more. On a container with no desktop
  that is dozens of lines per start, repeated on every restart, and it buries
  anything that actually matters.

  Debian's packaged system.conf runs the daemon as the `messagebus` user, which
  requires root to switch to. This service runs as `flowkit`, so it ships its
  own config instead: same socket path, no user switch, and permissive policy
  because the only client is the Chrome sitting beside it in this container.
-->
<busconfig>
  <type>system</type>

  <listen>unix:path=/run/dbus/system_bus_socket</listen>

  <policy context="default">
    <allow user="*"/>
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>

  <limit name="max_incoming_bytes">1000000000</limit>
  <limit name="max_outgoing_bytes">1000000000</limit>
  <limit name="max_message_size">1000000000</limit>
</busconfig>
